## Optional convenience for T-002 (PostgreSQL + Prisma).
##
## This repo's primary dev setup assumes PostgreSQL is already installed natively
## (see README.md "Database (PostgreSQL + Prisma)"). This file is provided as an
## alternative for any machine without a native Postgres install: run
## `docker compose up -d` to get an equivalent local database with zero manual setup.
##
## Either path produces the same thing: a Postgres server on localhost:5432 with a
## database matching server/.env's DATABASE_URL.

services:
  postgres:
    image: postgres:16-alpine
    container_name: english_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_platform_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
